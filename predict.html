<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Match Predictor — Prédiction</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --surface2: #1a1a26;
    --border: #2a2a3d;
    --accent: #00e5ff;
    --accent2: #7c3aed;
    --green: #00ff88;
    --red: #ff4466;
    --yellow: #ffd600;
    --text: #e8e8f0;
    --muted: #6b6b8a;
    --font-display: 'Bebas Neue', sans-serif;
    --font-mono: 'DM Mono', monospace;
    --font-body: 'DM Sans', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body { background: var(--bg); color: var(--text); font-family: var(--font-body); min-height: 100vh; overflow-y: auto; }

  nav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 20px; border-bottom: 1px solid var(--border); background: var(--surface);
  }
  .nav-logo { font-family: var(--font-display); font-size: 1.5rem; letter-spacing: 2px; color: var(--accent); }
  .nav-links { display: flex; gap: 8px; }
  .nav-links a {
    padding: 8px 20px; border-radius: 6px; text-decoration: none;
    font-size: 0.85rem; font-weight: 500; color: var(--muted); transition: all 0.2s;
  }
  .nav-links a.active, .nav-links a:hover { background: var(--surface2); color: var(--text); }
  .nav-links a.active { color: var(--accent); border: 1px solid var(--border); }

  .container { max-width: 900px; margin: 0 auto; padding: 16px 14px; }
  .page-header { margin-bottom: 14px; }
  .page-header h1 { font-family: var(--font-display); font-size: 2rem; letter-spacing: 2px; margin-bottom: 4px; }
  .page-header p { color: var(--muted); font-size: 0.82rem; line-height: 1.25; }

  /* TRAIN SECTION */
  .section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 12px;
  }
  .section-title {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 14px;
  }

  .train-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .model-status {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    flex: 1;
  }
  .status-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--muted); flex-shrink: 0;
  }
  .status-dot.ready { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .status-dot.loading { animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .status-text { font-size: 0.82rem; }

  .textarea {
    width: 100%;
    min-height: 70px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 0.88rem;
    padding: 12px;
    resize: vertical;
    outline: none;
    transition: border-color 0.2s;
    margin-bottom: 10px;
    line-height: 1.35;
  }
  .textarea:focus { border-color: var(--accent); }

  .match-list {
    display: grid;
    gap: 8px;
    margin-top: 10px;
  }
  .match-card {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 8px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px;
    align-items: center;
  }
  .match-card div {
    color: var(--text);
    font-size: 0.82rem;
    line-height: 1.2;
  }
  .match-card-label {
    display: block;
    color: var(--muted);
    font-size: 0.72rem;
    margin-bottom: 4px;
  }
  .match-card-actions {
    display: flex;
    flex-direction: column;
    gap: 6px;
    align-items: flex-end;
  }
  .match-card-result {
    margin-top: 8px;
    color: var(--muted);
    font-size: 0.75rem;
    white-space: nowrap;
  }
  .match-card-result span {
    opacity: 0.8;
    margin-right: 8px;
  }

  .prediction-panel {
    display: none;
    margin-top: 16px;
  }
  .prediction-summary {
    display: grid;
    grid-template-columns: repeat(4, minmax(100px, 1fr));
    gap: 10px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 12px;
  }
  .summary-metric {
    display: flex;
    flex-direction: column;
    gap: 4px;
    color: var(--text);
  }
  .summary-metric strong {
    font-size: 1.05rem;
  }
  .summary-label {
    color: var(--muted);
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .result-card {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 12px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    align-items: center;
  }
  .result-card-left {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .result-card-right {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: flex-end;
    color: var(--muted);
    font-size: 0.78rem;
    text-align: right;
  }
  .result-chip {
    display: inline-flex;
    padding: 4px 10px;
    border-radius: 999px;
    border: 1px solid var(--border);
    font-size: 0.75rem;
    background: rgba(255,255,255,0.04);
    color: var(--text);
  }
  .result-badge {
    display: inline-flex;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
  }
  .result-badge.D { color: var(--green); }
  .result-badge.N { color: var(--yellow); }
  .result-badge.E { color: var(--red); }
  .result-time { opacity: 0.7; }

  /* BUTTONS */
  .btn {
    padding: 10px 20px; border: none; border-radius: 8px;
    font-family: var(--font-body); font-size: 0.85rem; font-weight: 500;
    cursor: pointer; transition: all 0.2s;
  }
  .btn-primary { background: var(--accent); color: #000; }
  .btn-primary:hover { background: #33eeff; transform: translateY(-1px); }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  .btn-purple { background: var(--accent2); color: #fff; }
  .btn-purple:hover { background: #8b4cf7; transform: translateY(-1px); }
  .btn-purple:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .spinner {
    display: inline-block; width: 16px; height: 16px;
    border: 2px solid rgba(0,229,255,0.3); border-top-color: var(--accent);
    border-radius: 50%; animation: spin 0.7s linear infinite;
    margin-right: 8px; vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .toast {
    position: fixed; bottom: 30px; right: 30px;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px 20px; font-size: 0.85rem;
    transform: translateY(80px); opacity: 0; transition: all 0.3s; z-index: 999;
  }
  .toast.show { transform: translateY(0); opacity: 1; }
  .toast.success { border-color: var(--green); color: var(--green); }
  .toast.error { border-color: var(--red); color: var(--red); }

  .accuracy-badge {
    display: inline-block; padding: 4px 14px;
    background: rgba(0,255,136,0.12); color: var(--green);
    border: 1px solid rgba(0,255,136,0.3);
    border-radius: 20px; font-family: var(--font-mono);
    font-size: 0.82rem; margin-left: 12px;
  }

  @media (max-width: 600px) {
    .train-row { flex-direction: column; align-items: stretch; }
  }
</style>
</head>
<body>

<nav>
  <div class="nav-logo">MATCHPRED</div>
  <div class="nav-links">
    <a href="/">Collecte</a>
    <a href="/predict" class="active">Prédiction</a>
  </div>
</nav>

<div class="container">
  <div class="page-header">
    <h1>PRÉDICTION</h1>
    <p>Collez un texte brut de cotes et lancez la prédiction globale.</p>
  </div>

  <!-- TRAIN -->
  <div class="section">
    <div class="section-title">🤖 Modèle XGBoost</div>
    <div class="train-row">
      <div class="model-status">
        <div class="status-dot" id="statusDot"></div>
        <div class="status-text" id="statusText">Vérification du modèle...</div>
        <span class="accuracy-badge" id="accuracyBadge" style="display:none"></span>
      </div>
      <button class="btn btn-purple" onclick="entrainer()" id="btnTrain">
        ⚡ Entraîner le modèle
      </button>
    </div>
  </div>

  <div class="section">
    <div class="section-title">📋 Coller les cotes brutes</div>
    <p class="hint">Collez le texte copié depuis Google Lens ou une capture, puis extrayez les cotes.</p>
    <textarea id="rawOddsText" class="textarea" placeholder="Collez le texte des cotes ici..."></textarea>
    <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:14px;">
      <button class="btn btn-purple" onclick="extraireCotesBrutes()" id="btnParseRaw">
        Extraire les cotes
      </button>
      <button class="btn btn-primary" onclick="predireTout()" id="btnPredictAll">
        Prédire tout
      </button>
      <span id="predictAllStatus" style="color:var(--muted); font-size:0.85rem;"></span>
    </div>
    <div id="rawMatchesList" class="match-list"></div>
    <div id="predictionPanel" class="prediction-panel">
      <div class="section-title">📊 Présentation des résultats</div>
      <div id="predictionSummary" class="prediction-summary"></div>
      <div id="predictionResultsList" class="match-list"></div>
    </div>
  </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = window.location.origin && window.location.origin !== 'null'
  ? window.location.origin
  : 'http://127.0.0.1:8000';
const labels = { "Domicile": "D", "Nul": "N", "Extérieur": "E" };
let rawMatches = [];
let rawResultLines = [];
let predictionResults = [];

function showPredictionPanel() {
  const panel = document.getElementById("predictionPanel");
  if (panel) panel.style.display = "block";
}

function resetPredictionPanel() {
  predictionResults = [];
  const panel = document.getElementById("predictionPanel");
  const summary = document.getElementById("predictionSummary");
  const list = document.getElementById("predictionResultsList");
  if (panel) panel.style.display = "none";
  if (summary) summary.innerHTML = "";
  if (list) list.innerHTML = "";
}

function renderPredictionSummary() {
  const summary = document.getElementById("predictionSummary");
  if (!summary) return;
  if (!predictionResults.length) {
    summary.innerHTML = "";
    return;
  }

  const counts = predictionResults.reduce((acc, item) => {
    acc[item.data.resultat] = (acc[item.data.resultat] || 0) + 1;
    return acc;
  }, {});

  summary.innerHTML = `
    <div class="summary-metric">
      <span class="summary-label">Total</span>
      <strong>${predictionResults.length}</strong>
    </div>
    <div class="summary-metric">
      <span class="summary-label">Domicile</span>
      <strong>${counts["Domicile"] || 0}</strong>
    </div>
    <div class="summary-metric">
      <span class="summary-label">Nul</span>
      <strong>${counts["Nul"] || 0}</strong>
    </div>
    <div class="summary-metric">
      <span class="summary-label">Extérieur</span>
      <strong>${counts["Extérieur"] || 0}</strong>
    </div>
  `;
}

function displayPredictionResult(index, match, data, elapsed) {
  const resultsList = document.getElementById("predictionResultsList");
  if (!resultsList) return;

  showPredictionPanel();
  predictionResults[index] = { match, data, elapsed };
  renderPredictionSummary();

  let row = document.getElementById(`prediction-row-${index}`);
  if (!row) {
    row = document.createElement("div");
    row.id = `prediction-row-${index}`;
    row.className = "result-card";
    resultsList.appendChild(row);
  }

  const resultClass = labels[data.resultat] || "";
  row.innerHTML = `
    <div class="result-card-left">
      <span class="result-chip">${match.equipe_dom} vs ${match.equipe_ext}</span>
      <span class="result-badge ${resultClass}">${data.resultat}</span>
    </div>
    <div class="result-card-right">
      <span>D: ${(data.probabilite_dom * 100).toFixed(0)}%</span>
      <span>N: ${(data.probabilite_nul * 100).toFixed(0)}%</span>
      <span>E: ${(data.probabilite_ext * 100).toFixed(0)}%</span>
      <span class="result-time">(${elapsed}s)</span>
    </div>
  `;
}

function storeResultsAndRedirect() {
  try {
    sessionStorage.setItem("predictionResults", JSON.stringify(predictionResults));
    window.location.href = "/results";
  } catch (error) {
    console.error(error);
  }
}

function showToast(msg, type="success") {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = `toast show ${type}`;
  setTimeout(() => t.className = "toast", 3500);
}

async function verifierStatut() {
  const dot = document.getElementById("statusDot");
  const txt = document.getElementById("statusText");
  dot.classList.remove("ready");
  dot.classList.add("loading");
  txt.textContent = "Vérification du modèle...";

  try {
    const res = await fetch(`${API}/prediction/statut`);
    const data = await res.json();
    dot.classList.remove("loading");

    if (data.modele_disponible) {
      dot.classList.add("ready");
      txt.textContent = "Modèle prêt à prédire";
    } else {
      txt.textContent = "Aucun modèle entraîné";
    }
  } catch(e) {
    dot.classList.remove("loading");
    txt.textContent = "Serveur non disponible";
  }
}

async function entrainer() {
  const btn = document.getElementById("btnTrain");
  btn.innerHTML = '<span class="spinner"></span>Entraînement...';
  btn.disabled = true;

  try {
    const res = await fetch(`${API}/prediction/entrainer`, { method:"POST" });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || "Erreur");

    document.getElementById("statusDot").classList.add("ready");
    document.getElementById("statusText").textContent = `Modèle entraîné — ${data.nb_matches} matchs`;

    const badge = document.getElementById("accuracyBadge");
    badge.textContent = `Précision: ${data.accuracy}%`;
    badge.style.display = "inline-block";

    showToast(`✅ Entraînement réussi ! Précision: ${data.accuracy}%`);
  } catch(e) {
    showToast(e.message, "error");
  } finally {
    btn.textContent = "⚡ Entraîner le modèle";
    btn.disabled = false;
  }
}


function extraireCotesBrutes(autoPredict = false) {
  const texte = document.getElementById("rawOddsText").value.trim();
  if (!texte) {
    showToast("Collez d'abord le texte des cotes.", "error");
    return Promise.reject(new Error("Texte vide"));
  }

  const btn = document.getElementById("btnParseRaw");
  btn.textContent = "Extraction...";
  btn.disabled = true;

  return fetch(`${API}/extraction/texte/cotes`, {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ texte })
  })
    .then(async res => {
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || "Impossible de parser les cotes.");
      rawMatches = data;
      rawResultLines = [];
      resetPredictionPanel();
      afficherMatchesBrutes(data);
      showToast(`✅ ${data.length} match(s) trouvé(s)`);
      if (autoPredict && rawMatches.length) {
        return predireTout();
      }
      return data;
    })
    .catch(e => {
      showToast(e.message, "error");
      throw e;
    })
    .finally(() => {
      btn.textContent = "Extraire les cotes";
      btn.disabled = false;
    });
}

function afficherMatchesBrutes(matches) {
  const container = document.getElementById("rawMatchesList");
  container.innerHTML = "";
  if (!matches.length) {
    resetPredictionPanel();
    container.innerHTML = "<p>Aucune cote détectée.</p>";
    return;
  }

  matches.forEach((match, index) => {
    const card = document.createElement("div");
    card.className = "match-card";

    const details = document.createElement("div");
    details.innerHTML = `
      <strong>${match.equipe_dom} vs ${match.equipe_ext}</strong>
      <div class="match-card-label">Domicile: ${match.cote_dom} • Nul: ${match.cote_nul} • Extérieur: ${match.cote_ext}</div>
    `;

    const actions = document.createElement("div");
    actions.className = "match-card-actions";

    const resultLine = document.createElement("div");
    resultLine.className = "match-card-result";
    resultLine.textContent = "Résultat non calculé";

    rawResultLines[index] = resultLine;

    actions.appendChild(resultLine);
    card.appendChild(details);
    card.appendChild(actions);
    container.appendChild(card);
  });
}

function predireMatch(match, resultLine, index) {
  const start = performance.now();
  resultLine.textContent = "Prédiction en cours...";
  return fetch(`${API}/prediction/predire`, {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ cote_dom: match.cote_dom, cote_nul: match.cote_nul, cote_ext: match.cote_ext })
  })
    .then(async res => {
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || "Erreur de prédiction.");
      const elapsed = ((performance.now() - start) / 1000).toFixed(2);
      resultLine.innerHTML = `<span class="result-badge ${labels[data.resultat] || ''}">${data.resultat}</span> D:${(data.probabilite_dom * 100).toFixed(0)}% • N:${(data.probabilite_nul * 100).toFixed(0)}% • E:${(data.probabilite_ext * 100).toFixed(0)}% <span style="opacity:.7; font-size:.8rem;">(${elapsed}s)</span>`;
      displayPredictionResult(index, match, data, elapsed);
      return data;
    })
    .catch(e => {
      resultLine.textContent = "Échec de prédiction";
      showToast(e.message, "error");
      throw e;
    });
}

function predireTout() {
  if (!rawMatches.length) {
    const texte = document.getElementById("rawOddsText").value.trim();
    if (!texte) {
      showToast("Collez d'abord le texte des cotes.", "error");
      return;
    }
    return extraireCotesBrutes(true);
  }

  const btn = document.getElementById("btnPredictAll");
  const status = document.getElementById("predictAllStatus");
  btn.textContent = "Prédiction...";
  btn.disabled = true;
  status.textContent = "0 / " + rawMatches.length;

  rawMatches.reduce((promise, match, index) => {
    return promise.then(() => {
      status.textContent = `${index + 1} / ${rawMatches.length}`;
      return predireMatch(match, rawResultLines[index], index);
    });
  }, Promise.resolve())
    .then(() => {
      status.textContent = `Terminé en ${rawMatches.length} match(s)`;
      storeResultsAndRedirect();
    })
    .catch(() => {
      status.textContent = `Terminé avec erreurs`;
    })
    .finally(() => {
      btn.textContent = "Prédire tout";
      btn.disabled = false;
    });
}

verifierStatut();
</script>
</body>
</html>
